name: build binaries

# Builds standalone executables (Bun runtime + bundled JS + sharp's native
# libraries) for every supported platform. Each binary is built natively on
# its own runner: sharp ships per-platform prebuilt addons, so
# cross-compilation is not an option.
#
# - push to main / manual dispatch: build + upload artifacts (smoke check)
# - push a v* tag: additionally create a GitHub release with all binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          # NOTE: arm64 runners are free for public repos only — comment this
          # entry out if the repo is private and has no paid plan.
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-13 # last Intel macOS runner
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the locally tested version.
          bun-version: 1.3.14

      - run: npm ci

      - run: npm run build

      # Bun appends .exe automatically on Windows.
      - run: bun scripts/build-binary.ts --outfile dist-bin/shoots-${{ matrix.target }}

      # Sanity check: the binary must at least start and print its version.
      - run: ./dist-bin/shoots-${{ matrix.target }}* --version
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: shoots-${{ matrix.target }}
          path: dist-bin/shoots-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum shoots-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
