name: release

# Builds standalone executables (Bun runtime + bundled JS + sharp's native
# libraries) for every supported platform and publishes them as a GitHub
# release. Each binary is built natively on its own runner: sharp ships
# per-platform prebuilt addons, so cross-compilation is not an option.
#
# Trigger: pushing a version tag (v*) — never a push to main. Release notes are
# generated from the conventional commits since the previous tag (git-cliff).
# To cut a release: bump the version, commit, then `git tag vX.Y.Z && git push --tags`.
#
# macOS is arm64 (Apple Silicon) only. Intel macOS (darwin-x64) is intentionally
# NOT built: it needs GitHub's last Intel runner (macos-13), whose queue routinely
# leaves jobs pending until they time out. The Bun binary embeds per-arch native
# addons (sharp/onnxruntime), so a universal2 / cross-compile is not an option
# here — dropping the target is the deliberate trade-off.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate the whole release on the suite before any binary is built or published.
  # Once, on one runner: the code under test is platform-independent, and the
  # per-OS risk that is real — a binary that lost its embedded bundle — is what
  # the version check in `build` covers instead.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Without it the seven sidecar-writing tests skip themselves — see ci.yml.
    env:
      SHOOTS_EXIFTOOL: /usr/bin/exiftool
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with ci.yml and the locally tested version.
          bun-version: 1.3.14

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          # NOTE: arm64 runners are free for public repos only.
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    # Safety net against execution hangs (does NOT cover queue/pending time).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the locally tested version.
          bun-version: 1.3.14

      - run: npm ci

      - run: npm run build

      # Bun appends .exe automatically on Windows.
      - run: bun scripts/build-binary.ts --outfile dist-bin/shoots-${{ matrix.target }}

      # Sanity check: the binary must start AND report *our* version. Checking
      # only that `--version` runs is not enough — a standalone binary that lost
      # its embedded bundle falls back to being the plain Bun CLI, which answers
      # with the runtime version and exits 0 (see docs/development.md,
      # "The post-processing trap").
      - name: Verify the binary reports our own version
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(./dist-bin/shoots-${{ matrix.target }}* --version)
          echo "expected=$expected actual=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::binary reports '$actual' but this is shoots $expected — the embedded bundle is missing or the version was not injected"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shoots-${{ matrix.target }}
          path: dist-bin/shoots-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog can diff against the prior tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Release notes from the conventional commits in this tag.
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum shoots-* > SHA256SUMS.txt

      # The installers ship as release assets too, not just as files on main:
      # www.shoots-ai.com/install.sh redirects here, and GitHub's per-asset
      # download_count is what tells us how many people ran the install command.
      # Attached outside artifacts/ so they stay out of SHA256SUMS.txt, which
      # covers the binaries the installer itself verifies.
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            artifacts/*
            install.sh
            install.ps1
          fail_on_unmatched_files: true
