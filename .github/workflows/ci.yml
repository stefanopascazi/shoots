name: ci

# Fast feedback on every push to main and every PR: typecheck, build, test.
# Standalone binaries are NOT built here — that happens on release tags
# (see release.yml). Keeps main green without the per-OS binary matrix cost.
#
# The tests that write XMP skip themselves when exiftool is absent (see
# packages/cli/test/fixtures.ts), which on a bare runner is all seven of them.
# The distro package is installed and pointed at rather than provisioning the
# pinned one: what those tests exercise is sidecar writing, not the download,
# and `shoots setup` would put a GitHub Releases fetch in front of every PR.
# Nothing else in the suite needs the network or a provisioned tool.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SHOOTS_EXIFTOOL: /usr/bin/exiftool
    steps:
      - uses: actions/checkout@v4

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The test runner is bun, not node — `npm test` shells out to `bun test`.
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with release.yml and the locally tested version.
          bun-version: 1.3.14

      - run: npm ci
      - run: npm run typecheck
      # Build and test are separate steps so a build break is reported as one,
      # instead of arriving as a wall of module-resolution failures — hence
      # `test:built`, which runs the suite against the dist just built rather
      # than building it a second time.
      - run: npm run build
      - run: npm run test:built
