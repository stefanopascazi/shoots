name: ci

# Fast feedback on every push to main and every PR: typecheck + build only.
# Standalone binaries are NOT built here — that happens on release tags
# (see release.yml). Keeps main green without the per-OS binary matrix cost.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      # `prebuild` mirrors ../docs into the site, so this also proves every docs
      # page still renders and is reachable from the sidebar.
      - run: npm run build
